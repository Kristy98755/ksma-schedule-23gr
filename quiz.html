<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест — патология беременности</title>
<style>
@font-face{font-family:'Orbitron';src:url('fonts/Orbitron.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap;}
@font-face{font-family:'Share Tech Mono';src:url('fonts/ShareTechMono.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap;}
html,body{margin:0;padding:0;height:100%;background:#050508;overflow:hidden;}
#c{display:block;width:100vw;height:100vh;height:100dvh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:default;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="quiz-data.js"></script>
<script>
'use strict';

const C = {
  bg: '#050508',
  cyan: '#00ffff',
  cyanDim: 'rgba(0,255,255,0.45)',
  mag: '#e94196',
  green: '#0f0',
  red: '#f00',
  text: '#e0e0e8'
};
const FD = s => `700 ${s}px 'Orbitron','Courier New',monospace`;
const FM = s => `400 ${s}px 'Share Tech Mono','Courier New',monospace`;
const LETTERS = ['а', 'б', 'в', 'г'];
const TIME_MS = 30000;
const SEQ_LEN = 15;
const LS_KEY = 'quiz_seat';

// ---------- API ----------
async function api(path, data) {
  const opts = { cache: 'no-store' };
  if (data !== undefined) {
    opts.method = 'POST';
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(data);
  }
  const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
  let tm = 0;
  if (ac) {
    opts.signal = ac.signal;
    tm = setTimeout(() => ac.abort(), 6000);
  }
  try {
    const r = await fetch('/api/quiz/' + path, opts);
    if (!r.ok) {
      const e = new Error('http ' + r.status);
      e.status = r.status;
      throw e;
    }
    return await r.json();
  } finally {
    if (tm) clearTimeout(tm);
  }
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

function fit() {
  dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // iframe мог загрузиться в скрытом контейнере (0×0) — перепроверяем размер
  if ((W === 0 || H === 0) && fit.retry < 200) {
    fit.retry++;
    setTimeout(fit, 250);
  }
}
fit.retry = 0;
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
window.addEventListener('pageshow', fit);
window.addEventListener('focus', fit);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fit);
}
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => fit()).observe(canvas);
}
fit();

// диагностика: ошибку рисуем прямо на канвасе, чтобы не было «пустого экрана»
window.addEventListener('error', e => {
  try {
    if (!W || !H) fit();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4060';
    ctx.font = '14px monospace';
    ctx.fillText('ERROR: ' + (e.message || 'unknown'), 16, 40);
    const st = (e.error && e.error.stack || '').split('\n').slice(0, 8);
    st.forEach((line, i) => ctx.fillText(line.slice(0, 110), 16, 66 + i * 18));
  } catch (err) {}
});

const S = {
  mode: 'select',       // select | menu | question | result
  seq: [],              // [{q, t}]
  qi: 0,
  phase: 'run',         // run | done
  chosen: -1,
  deadline: 0,
  hover: null,
  hoverBtn: null,
  hits: [],
  // сессия
  seat: -1,             // индекс студента
  claimed: false,       // место занято на сервере
  online: false,        // сервер доступен
  answers: [],          // [{q: gid, c: choice}] — сердцебиение и complete
  score: 15,            // личный балл (захардкожен в STUDENTS)
  resume: 0,            // с какого вопроса продолжаем
  // селектор
  sel: { loading: true, offline: false, list: [], open: false, pick: -1, err: null, busy: false }
};

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickSeq() {
  const picked = [];
  TOPICS.forEach((t, ti) => {
    shuffle(t.qs).slice(0, 5).forEach(q => picked.push({ q, t: ti }));
  });
  return shuffle(picked);
}

// ---------- селектор студента ----------
function enterOfflineSelector(msg) {
  S.online = false;
  S.sel.loading = false;
  S.sel.offline = true;
  S.sel.offlineMsg = msg ? String(msg).slice(0, 80) : '';
  S.sel.list = STUDENTS.map((_, i) => ({ i, occupied: false, progress: 0, completed: false }));
  S.mode = 'select';
}
async function loadSelector() {
  S.sel = { loading: true, offline: false, offlineMsg: null, list: [], open: false, pick: -1, err: null, busy: false };
  S.mode = 'select';
  try {
    const st = await api('students');
    S.sel.list = st.students.map(s => ({ i: s.i, occupied: !!s.occupied, progress: s.progress, completed: !!s.completed }));
    S.online = true;
    S.sel.loading = false;
  } catch (e) {
    enterOfflineSelector(e && e.message);
  }
}
async function confirmSelection() {
  if (S.sel.busy || S.sel.pick < 0) return;
  const i = S.sel.pick;
  const row = S.sel.list[i];
  if (row && row.occupied) { S.sel.err = 'МЕСТО УЖЕ ЗАНЯТО'; return; }
  S.sel.busy = true;
  S.sel.err = null;
  lsSet(LS_KEY, String(i));
  S.seat = i;
  S.score = STUDENTS[i].score;
  S.answers = [];
  S.resume = 0;
  S.claimed = false;
  S.sel.busy = false;
  S.mode = 'menu';
  S.hoverBtn = null;
}

// ---------- сессия ----------
async function initSession() {
  const saved = lsGet(LS_KEY);
  if (saved !== null) {
    try {
      const st = await api('state?i=' + encodeURIComponent(saved));
      if (st.occupied && st.age !== null && st.age <= 45) {
        const seat = parseInt(saved, 10);
        if (seat >= 0 && seat < STUDENTS.length) {
          // продолжаем без выбора
          S.seat = seat;
          S.score = STUDENTS[seat].score;
          S.answers = Array.isArray(st.answers) ? st.answers : [];
          S.resume = Math.min(st.progress || 0, SEQ_LEN);
          S.online = true;
          S.claimed = true;
          S.mode = 'menu';
          return;
        }
      } else {
        await api('release', { i: parseInt(saved, 10) });
      }
    } catch (e) {
      lsDel(LS_KEY);
      enterOfflineSelector(e && e.message);
      return;
    }
    lsDel(LS_KEY);
  }
  await loadSelector();
}

function heartbeat(done) {
  if (!S.online || !S.claimed || S.seat < 0) return;
  api('heartbeat', { i: S.seat, done: done, answers: S.answers }).catch(() => {});
}

function startTest() {
  if (S.online && !S.claimed) {
    api('start', { i: S.seat }).then(() => {
      S.claimed = true;
      beginRun();
    }).catch(e => {
      if (e.status === 409) {
        S.claimed = false;
        loadSelector().then(() => { S.sel.err = 'МЕСТО УЖЕ ЗАНЯТО'; S.sel.pick = -1; });
      } else {
        // сервер не отвечает — пускаем без сохранения
        S.online = false;
        S.claimed = false;
        beginRun();
      }
    });
    return;
  }
  beginRun();
}

function beginRun() {
  S.seq = pickSeq();
  S.qi = Math.min(S.resume || 0, SEQ_LEN);
  S.hover = null;
  S.hoverBtn = null;
  if (S.qi >= SEQ_LEN) {
    S.mode = 'result';
  } else {
    S.mode = 'question';
    beginQuestion();
  }
}

function beginQuestion() {
  S.phase = 'run';
  S.chosen = -1;
  S.deadline = performance.now() + TIME_MS;
}
function answer(i) {
  if (S.mode !== 'question' || S.phase !== 'run') return;
  S.chosen = i;
  S.phase = 'done';
  S.answers.push({ q: S.seq[S.qi].q.g, c: i });
  heartbeat(S.qi + 1);
}
function onTimeout() {
  S.phase = 'done';
  S.chosen = -1;
  S.answers.push({ q: S.seq[S.qi].q.g, c: -1 });
  heartbeat(S.qi + 1);
}
function next() {
  if (S.mode === 'question' && S.phase === 'done') {
    S.qi++;
    if (S.qi >= SEQ_LEN) {
      finishTest();
    } else {
      beginQuestion();
    }
  }
}
function finishTest() {
  S.mode = 'result';
  S.hover = null;
  S.hoverBtn = null;
  if (S.online && S.claimed) {
    api('complete', { i: S.seat, answers: S.answers }).catch(() => {});
  }
  S.claimed = false;
  S.resume = 0;
  lsDel(LS_KEY);
}
function restartTest() {
  S.resume = 0;
  S.answers = [];
  startTest();
}
function backToMenu() {
  S.mode = 'menu';
  S.hoverBtn = null;
}
function primaryAction() {
  if (S.mode === 'select') confirmSelection();
  else if (S.mode === 'menu') startTest();
  else if (S.mode === 'question') next();
  else if (S.mode === 'result') restartTest();
}

// ---------- drawing helpers ----------
function neon(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur || 0; }
function noNeon() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; }

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function measureSpaced(str, font, sp) {
  ctx.font = font;
  let w = 0;
  for (const ch of str) w += ctx.measureText(ch).width + sp;
  return w - sp;
}

function txt(str, x, y, opt) {
  opt = opt || {};
  const font = opt.font || FM(14);
  const color = opt.color || C.cyan;
  const align = opt.align || 'left';
  const baseline = opt.baseline || 'alphabetic';
  const sp = opt.spacing || 0;
  ctx.font = font;
  ctx.textBaseline = baseline;
  ctx.textAlign = sp ? 'left' : align;
  ctx.fillStyle = color;
  if (opt.alpha !== undefined) ctx.globalAlpha = opt.alpha;
  if (opt.glow) neon(color, opt.glow);
  if (!sp) {
    ctx.fillText(str, x, y);
  } else {
    let w = measureSpaced(str, font, sp);
    let cx = x;
    if (align === 'center') cx = x - w / 2;
    else if (align === 'right') cx = x - w;
    for (const ch of str) {
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + sp;
    }
  }
  noNeon();
  ctx.globalAlpha = 1;
}

function wrapText(str, maxW, font) {
  ctx.font = font;
  const words = str.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) line = t;
    else { if (line) lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBG(t) {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0,255,255,0.045)';
  ctx.lineWidth = 1;
  const step = 44;
  ctx.beginPath();
  for (let x = 0; x <= W; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  const by = ((t / 26) % (H + 240)) - 120;
  const g = ctx.createLinearGradient(0, by - 70, 0, by + 70);
  g.addColorStop(0, 'rgba(0,255,255,0)');
  g.addColorStop(0.5, 'rgba(0,255,255,0.05)');
  g.addColorStop(1, 'rgba(0,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, by - 70, W, 140);

  const mg = ctx.createRadialGradient(W / 2, -H * 0.12, 0, W / 2, -H * 0.12, H * 0.95);
  mg.addColorStop(0, 'rgba(233,65,150,0.10)');
  mg.addColorStop(1, 'rgba(233,65,150,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, W, H);

  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(0,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(6.5, 6.5, W - 13, H - 13);
  ctx.fillStyle = C.mag;
  const c = 14;
  [[6, 6], [W - 6 - c, 6], [6, H - 6 - c], [W - 6 - c, H - 6 - c]].forEach(p => {
    ctx.fillRect(p[0], p[1], c, 2);
    ctx.fillRect(p[0], p[1], 2, c);
  });
}

function addHit(x, y, w, h, fn, tag) { S.hits.push({ x, y, w, h, fn, tag: tag || null }); }

function hitAt(px, py) {
  for (let i = S.hits.length - 1; i >= 0; i--) {
    const h = S.hits[i];
    if (px >= h.x && px <= h.x + h.w && py >= h.y && py <= h.y + h.h) return h;
  }
  return null;
}

function drawButton(x, y, w, h, label, opt) {
  opt = opt || {};
  const col = opt.color || C.cyan;
  const hovered = opt.hovered;
  roundRect(x, y, w, h, 6);
  ctx.fillStyle = hovered ? (opt.fillHover || 'rgba(0,255,255,0.14)') : 'rgba(0,255,255,0.05)';
  ctx.fill();
  neon(col, hovered ? 18 : 10);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.stroke();
  noNeon();
  txt(label, x + w / 2, y + h / 2 + 1, {
    font: opt.font || FD(Math.min(20, h * 0.42)),
    color: col, align: 'center', baseline: 'middle', glow: hovered ? 12 : 6, spacing: opt.spacing !== undefined ? opt.spacing : 2
  });
}

function fitSpaced(str, maxW, sp) {
  let fs = 16;
  while (fs > 10 && measureSpaced(str, FM(fs), sp) > maxW) fs--;
  return fs;
}

// ---------- screens ----------
function drawMenu(t) {
  const cx = W / 2;
  const chipY = Math.max(30, H * 0.14);
  txt('// NEURO-TEST v1.0', cx, chipY, { font: FM(13), color: C.mag, align: 'center', glow: 8, spacing: 2 });

  const titleY = chipY + Math.min(76, H * 0.13);
  const tf = FD(Math.min(46, Math.max(26, W * 0.09)));
  const sp = 6;
  const tw = measureSpaced('MEMENTO MORI', tf, sp);
  txt('MEMENTO MORI', cx - 2, titleY, { font: tf, color: C.mag, align: 'center', spacing: sp, alpha: 0.55 });
  txt('MEMENTO MORI', cx + 2, titleY, { font: tf, color: 'rgba(0,255,255,0.6)', align: 'center', spacing: sp });
  txt('MEMENTO MORI', cx, titleY, { font: tf, color: C.cyan, align: 'center', spacing: sp, glow: 16 });

  txt('ТЕСТ: ПАТОЛОГИЯ БЕРЕМЕННОСТИ', cx, titleY + 34, { font: FM(15), color: C.text, align: 'center', spacing: 1, glow: 4 });
  txt('15 ВОПРОСОВ · 5 ИЗ КАЖДОЙ ТЕМЫ · 30 СЕК НА ВОПРОС', cx, titleY + 60, { font: FM(12), color: 'rgba(0,255,255,0.65)', align: 'center' });

  if (S.seat >= 0) {
    const nm = STUDENTS[S.seat].name;
    txt(`// ${nm}`, cx, titleY + 88, { font: FM(fitSpaced(nm, W - 40, 1)), color: C.cyan, align: 'center', glow: 6, spacing: 1 });
    if (!S.online) {
      txt('// БЕЗ СОХРАНЕНИЯ', cx, titleY + 108, { font: FM(11), color: C.mag, align: 'center', spacing: 2 });
    }
  }

  const bw = Math.min(W - 48, 360), bh = 64;
  const bx = cx - bw / 2, by = Math.min(H - 190, titleY + 120);
  const hov = S.hoverBtn === 'start';
  drawButton(bx, by, bw, bh, 'Тест', { hovered: hov, font: FD(26), spacing: 8 });
  addHit(bx, by, bw, bh, startTest, 'start');

  const pulse = 0.5 + 0.5 * Math.sin(t / 350);
  ctx.globalAlpha = 0.4 + 0.6 * pulse;
  txt(S.resume > 0 ? `// ПРОДОЛЖЕНИЕ С ВОПРОСа ${pad2(S.resume + 1)}` : '// ВРЕМЯ ИДЁТ', cx, by + bh + 44, { font: FM(13), color: C.mag, align: 'center', glow: 8, spacing: 3 });
  ctx.globalAlpha = 1;
}

function drawSelect(t) {
  const cx = W / 2;
  const y0 = Math.max(26, H * 0.09);
  txt('// ДОСТУП К ТЕСТУ', cx, y0, { font: FM(13), color: C.mag, align: 'center', glow: 8, spacing: 2 });
  txt('КАК ТЕБЯ ЗОВУТ?', cx, y0 + 44, {
    font: FD(Math.min(30, Math.max(18, W * 0.065))),
    color: C.cyan, align: 'center', spacing: 3, glow: 14
  });

  const dw = Math.min(W - 36, 440), dh = 52;
  const dx = cx - dw / 2, dy = y0 + 70;

  if (S.sel.loading) {
    const blink = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t / 300));
    ctx.globalAlpha = blink;
    txt('// ЗАГРУЗКА СПИСКА...', cx, dy + dh / 2, { font: FM(14), color: C.cyan, align: 'center', baseline: 'middle', spacing: 2 });
    ctx.globalAlpha = 1;
    return;
  }

  const pick = S.sel.pick;
  const open = S.sel.open && pickOpenAvailable();

  // выпадающий список
  roundRect(dx, dy, dw, dh, 6);
  ctx.fillStyle = open ? 'rgba(0,255,255,0.10)' : (S.hoverBtn === 'drop' ? 'rgba(0,255,255,0.09)' : 'rgba(0,255,255,0.05)');
  ctx.fill();
  neon(C.cyan, open ? 16 : 8);
  ctx.strokeStyle = C.cyan;
  ctx.lineWidth = 2;
  ctx.stroke();
  noNeon();

  const label = pick >= 0 ? STUDENTS[pick].name : '— выберите ФИ —';
  const lfs = fitSpaced(label, dw - 70, 1);
  txt(label, dx + 16, dy + dh / 2, {
    font: FM(lfs),
    color: pick >= 0 ? C.text : 'rgba(0,255,255,0.5)',
    baseline: 'middle', spacing: 1, glow: pick >= 0 ? 4 : 0
  });
  txt(open ? '▲' : '▼', dx + dw - 20, dy + dh / 2, { font: FM(14), color: C.cyan, align: 'center', baseline: 'middle', glow: 6 });
  addHit(dx, dy, dw, dh, () => { S.sel.open = !S.sel.open; S.hoverBtn = null; }, 'drop');

  // панель со списком
  let by = dy + dh + 18;
  if (open) {
    const rowH = Math.max(26, Math.min(44, (H - dy - dh - 130) / 10));
    const py = dy + dh + 6;
    const ph = rowH * 10 + 8;
    roundRect(dx, py, dw, ph, 6);
    ctx.fillStyle = 'rgba(5,5,8,0.97)';
    ctx.fill();
    neon('rgba(0,255,255,0.5)', 8);
    ctx.strokeStyle = 'rgba(0,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
    noNeon();

    S.sel.list.forEach((s, idx) => {
      const ry = py + 4 + idx * rowH;
      const hov = S.hoverBtn === 'row' + idx;
      const occupied = !!s.occupied;
      const selected = pick === idx;
      if (selected) {
        ctx.fillStyle = 'rgba(0,255,255,0.12)';
        ctx.fillRect(dx + 4, ry, dw - 8, rowH);
      } else if (hov && !occupied) {
        ctx.fillStyle = 'rgba(0,255,255,0.06)';
        ctx.fillRect(dx + 4, ry, dw - 8, rowH);
      }
      if (idx > 0) {
        ctx.strokeStyle = 'rgba(0,255,255,0.10)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(dx + 10, ry + 0.5);
        ctx.lineTo(dx + dw - 10, ry + 0.5);
        ctx.stroke();
      }

      const rx = dx + 20, rr = Math.min(8, rowH * 0.24);
      ctx.beginPath();
      ctx.arc(rx, ry + rowH / 2, rr, 0, Math.PI * 2);
      ctx.strokeStyle = occupied ? 'rgba(224,224,232,0.3)' : C.cyan;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      if (selected) {
        ctx.beginPath();
        ctx.arc(rx, ry + rowH / 2, rr - 3, 0, Math.PI * 2);
        ctx.fillStyle = C.cyan;
        ctx.fill();
      }

      const nm = STUDENTS[idx].name;
      let nfs = Math.max(11, Math.min(16, rowH * 0.42));
      while (nfs > 10 && measureSpaced(nm, FM(nfs), 1) > dw - 150) nfs--;
      txt(nm, dx + 40, ry + rowH / 2, {
        font: FM(nfs),
        color: occupied ? 'rgba(224,224,232,0.35)' : (selected ? C.cyan : C.text),
        baseline: 'middle', spacing: 1, glow: selected && !occupied ? 6 : 0
      });

      const status = occupied ? 'ЗАНЯТО' : (s.completed ? 'СДАН' : 'СВОБОДНО');
      const scol = occupied ? 'rgba(224,224,232,0.30)' : (s.completed ? 'rgba(233,65,150,0.8)' : 'rgba(15,255,150,0.7)');
      txt(status, dx + dw - 16, ry + rowH / 2, { font: FM(11), color: scol, align: 'right', baseline: 'middle', spacing: 1 });

      if (!occupied) {
        addHit(dx + 4, ry, dw - 8, rowH, () => {
          S.sel.pick = idx;
          S.sel.open = false;
          S.sel.err = null;
          S.hoverBtn = null;
        }, 'row' + idx);
      }
    });
    by = py + ph + 14;
  }

  // кнопка подтверждения
  const bh = 52;
  const rowP = S.sel.list[pick];
  const canGo = pick >= 0 && !(rowP && rowP.occupied);
  drawButton(dx, by, dw, bh, 'ПОДТВЕРДИТЬ', {
    hovered: canGo && S.hoverBtn === 'go',
    color: canGo ? C.cyan : 'rgba(0,255,255,0.30)',
    font: FD(18), spacing: 5
  });
  if (canGo) addHit(dx, by, dw, bh, confirmSelection, 'go');

  let infoY = by + bh + 30;
  if (S.sel.offline) {
    const ry = by + bh + 10;
    drawButton(dx, ry, dw, 46, 'ПОВТОРИТЬ СВЯЗЬ', {
      hovered: S.hoverBtn === 'retry', color: C.mag, font: FD(15), spacing: 4
    });
    addHit(dx, ry, dw, 46, () => { S.sel.err = null; loadSelector(); S.hoverBtn = null; }, 'retry');
    infoY = ry + 46 + 26;
    txt('// СЕРВЕР НЕ ОТВЕЧАЕТ — ПУСКАТЬ БЕЗ СОХРАНЕНИЯ', cx, infoY, { font: FM(11), color: C.mag, align: 'center', spacing: 2 });
    infoY += 20;
    if (S.sel.offlineMsg) {
      txt(S.sel.offlineMsg, cx, infoY, { font: FM(10), color: 'rgba(255,64,96,0.75)', align: 'center', spacing: 1 });
      infoY += 22;
    }
  }
  if (S.sel.err) {
    txt('// ' + S.sel.err, cx, infoY, { font: FM(12), color: C.red, align: 'center', spacing: 2, glow: 6 });
  }
}

function pickOpenAvailable() {
  return S.sel.list.length > 0;
}

function questionLayout(q) {
  const barH = 8;
  const headH = W < 480 ? 40 : 46;
  const topY = barH + headH;
  const labelY = topY + 14;
  const qTop = topY + 26;
  const maxW = W - 40;
  const sizes = W < 600 ? [19, 17, 15, 13] : [23, 21, 19, 17];
  let fs = sizes[sizes.length - 1];
  let lines = wrapText(q.q, maxW, FM(fs));
  for (const s of sizes) {
    const l = wrapText(q.q, maxW, FM(s));
    const qH = l.length * s * 1.35;
    if (qTop + qH + 14 + 150 + 14 <= H) { fs = s; lines = l; break; }
  }
  const qH = lines.length * fs * 1.35;
  let gridTop = qTop + qH + 14;
  const minGrid = Math.min(150, H * 0.55);
  if (H - gridTop - 14 < minGrid) gridTop = Math.max(topY + 40, H - 14 - minGrid);
  const gap = W < 600 ? 10 : 14;
  const gridH = H - gridTop - 14;
  const cardW = (W - 40 - gap) / 2;
  const cardH = (gridH - gap) / 2;
  return { barH, headH, topY, labelY, qTop, fs, lines, gridTop, gap, cardW, cardH, maxW };
}

function drawQuestion(t) {
  const item = S.seq[S.qi];
  const q = item.q;
  const L = questionLayout(q);
  const run = S.phase === 'run';
  const rem = Math.max(0, S.deadline - t);

  // countdown bar (full width)
  ctx.fillStyle = 'rgba(0,255,255,0.10)';
  ctx.fillRect(0, 0, W, L.barH);
  if (run) {
    const p = rem / TIME_MS;
    const low = rem <= 5000;
    const col = low ? C.mag : C.cyan;
    const blink = low ? 0.6 + 0.4 * Math.sin(t / 90) : 1;
    ctx.globalAlpha = blink;
    neon(col, 10);
    ctx.fillStyle = col;
    ctx.fillRect(0, 0, W * p, L.barH);
    noNeon();
    ctx.globalAlpha = 1;
  }

  // header
  const headMid = 8 + L.headH / 2;
  txt(`ВОПРОС ${pad2(S.qi + 1)}/15`, 20, headMid, { font: FM(13), color: C.cyan, baseline: 'middle', glow: 5, spacing: 1 });

  if (run) {
    const secs = Math.ceil(rem / 1000);
    const low = secs <= 5;
    txt(`00:${pad2(secs)}`, W - 20, headMid, {
      font: FD(W < 480 ? 18 : 20), color: low ? C.mag : C.cyan,
      align: 'right', baseline: 'middle', glow: low ? 14 : 8
    });
  } else {
    const bw = Math.min(150, W * 0.4), bh = L.headH - 12;
    const bx = W - 20 - bw, by = 8 + (L.headH - bh) / 2;
    drawButton(bx, by, bw, bh, 'Далее', { hovered: S.hoverBtn === 'next', font: FD(Math.min(17, bh * 0.45)), spacing: 3 });
    addHit(bx, by, bw, bh, next, 'next');
  }

  // topic chip + question
  txt(`// ${TOPICS[item.t].name}`, 20, L.labelY, { font: FM(12), color: C.mag, glow: 6, spacing: 2 });
  let y = L.qTop + L.fs;
  for (const line of L.lines) {
    txt(line, 20, y, { font: FM(L.fs), color: C.cyan, glow: 4 });
    y += L.fs * 1.35;
  }

  // answer cards 2x2
  const correct = q.a;
  const done = !run;
  for (let i = 0; i < 4; i++) {
    const col = i % 2, row = (i / 2) | 0;
    const x = 20 + col * (L.cardW + L.gap);
    const cy = L.gridTop + row * (L.cardH + L.gap);
    let state;
    if (!done) state = S.hover === i ? 'hover' : 'idle';
    else if (i === correct) state = 'correct';
    else if (i === S.chosen) state = 'wrong';
    else state = 'dim';
    drawCard(i, x, cy, L.cardW, L.cardH, q.o[i], state);
    if (!done) addHit(x, cy, L.cardW, L.cardH, () => answer(i));
  }
}

function drawCard(i, x, y, w, h, label, state) {
  let border = C.cyanDim, glow = 0, col = C.cyan, fill = 'rgba(0,255,255,0.05)';
  if (state === 'hover') { border = C.cyan; glow = 12; fill = 'rgba(0,255,255,0.10)'; }
  if (state === 'correct') { border = C.green; glow = 18; col = C.green; fill = 'rgba(0,255,0,0.07)'; }
  if (state === 'wrong') { border = C.red; glow = 18; col = C.red; fill = 'rgba(255,0,0,0.07)'; }
  const dimA = state === 'dim' ? 0.35 : 1;
  ctx.globalAlpha = dimA;

  roundRect(x, y, w, h, 8);
  ctx.fillStyle = fill;
  ctx.fill();
  neon(border, glow || 6);
  ctx.strokeStyle = border;
  ctx.lineWidth = state === 'idle' ? 1.5 : 2;
  ctx.stroke();
  noNeon();
  ctx.globalAlpha = 1;

  const badge = Math.min(30, h * 0.36);
  const bx = x + 12, by = y + (h - badge) / 2;
  ctx.globalAlpha = dimA;
  ctx.beginPath();
  ctx.arc(bx + badge / 2, by + badge / 2, badge / 2, 0, Math.PI * 2);
  ctx.strokeStyle = border;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
  txt(LETTERS[i], bx + badge / 2, by + badge / 2 + 1, { font: FM(badge * 0.55), color: col, align: 'center', baseline: 'middle', alpha: dimA });

  const tx = x + 12 + badge + 8, tw = x + w - 10 - tx;
  let fs = W < 600 ? 14 : 15;
  let lines = wrapText(label, tw, FM(fs));
  const maxLines = Math.max(3, Math.floor((h - 10) / (fs * 1.25)));
  while (lines.length > maxLines && fs > 10) {
    fs--;
    lines = wrapText(label, tw, FM(fs));
  }
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    lines[maxLines - 1] += '…';
  }
  const lh = fs * 1.3;
  const blockH = lines.length * lh;
  let ty = y + (h - blockH) / 2 + lh * 0.8;
  for (const line of lines) {
    txt(line, tx, ty, { font: FM(fs), color: col, glow: state === 'correct' || state === 'wrong' ? 8 : 3, alpha: dimA });
    ty += lh;
  }
  ctx.globalAlpha = 1;
}

function drawResult() {
  const cx = W / 2;
  const y0 = Math.max(40, H * 0.16);
  txt('// СЕАНС ЗАВЕРШЁН', cx, y0, { font: FM(13), color: C.mag, align: 'center', glow: 8, spacing: 2 });

  const sf = Math.min(72, Math.max(40, W * 0.16));
  txt(`${S.score}/15`, cx, y0 + sf + 10, { font: FD(sf), color: C.cyan, align: 'center', glow: 20, spacing: 4 });

  const nm = S.seat >= 0 ? STUDENTS[S.seat].name : 'СТУДЕНТ';
  const nameY = y0 + sf + 48;
  txt(nm, cx, nameY, { font: FM(fitSpaced(nm, W - 40, 1)), color: C.text, align: 'center', glow: 4, spacing: 1 });

  const verdict = S.score >= 13 ? 'NEURO-УРОВЕНЬ ПОДТВЕРЖДЁН'
     : S.score >= 10 ? 'СИСТЕМА СТАБИЛЬНА'
    : 'ТРЕБУЕТСЯ ПЕРЕПРОШИВКА';
  const vy = nameY + 56;
  ctx.globalAlpha = 0.7 + 0.3 * Math.sin(performance.now() / 400);
  txt(verdict, cx, vy, { font: FM(15), color: C.mag, align: 'center', glow: 10, spacing: 2 });
  ctx.globalAlpha = 1;

  if (!S.online) {
    txt('// БЕЗ СОХРАНЕНИЯ', cx, vy + 30, { font: FM(11), color: 'rgba(233,65,150,0.7)', align: 'center', spacing: 2 });
  }

  const bw = Math.min((W - 60) / 2, 220), bh = 56;
  const gap = 14;
  const by = Math.min(H - 90, vy + (S.online ? 56 : 76));
  const x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
  drawButton(x1, by, bw, bh, 'Заново', { hovered: S.hoverBtn === 'again', font: FD(18), spacing: 4 });
  addHit(x1, by, bw, bh, restartTest, 'again');
  drawButton(x2, by, bw, bh, 'Меню', { hovered: S.hoverBtn === 'menu', color: C.mag, font: FD(18), spacing: 4 });
  addHit(x2, by, bw, bh, backToMenu, 'menu');
}

function draw(t) {
  S.hits = [];
  drawBG(t);
  if (S.mode === 'select') drawSelect(t);
  else if (S.mode === 'menu') drawMenu(t);
  else if (S.mode === 'question') drawQuestion(t);
  else drawResult();
}

function frame(t) {
  if (S.mode === 'question' && S.phase === 'run' && t >= S.deadline) onTimeout();
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- input ----------
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  const src = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: src.clientX - r.left, y: src.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => {
  const p = pointerPos(e);
  const h = hitAt(p.x, p.y);
  if (h) { e.preventDefault(); h.fn(); S.hoverBtn = null; }
});
canvas.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  const h = hitAt(p.x, p.y);
  S.hover = null;
  S.hoverBtn = null;
  if (h) {
    canvas.style.cursor = 'pointer';
    if (h.tag) S.hoverBtn = h.tag;
    else if (S.mode === 'question' && S.phase === 'run') S.hover = S.hits.indexOf(h);
  } else {
    canvas.style.cursor = 'default';
  }
});
canvas.addEventListener('pointerleave', () => { S.hover = null; S.hoverBtn = null; });

window.addEventListener('keydown', e => {
  if (S.mode === 'question' && S.phase === 'run' && e.key >= '1' && e.key <= '4') {
    answer(+e.key - 1);
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    primaryAction();
  } else if (e.key === 'Escape' && S.mode === 'select') {
    S.sel.open = false;
  }
});

document.fonts.load(FD(40)).catch(() => {});
document.fonts.load(FM(16)).catch(() => {});

initSession().catch(() => { enterOfflineSelector(); });
</script>
